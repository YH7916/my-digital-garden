name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        id: pages
      - uses: astral-sh/setup-uv@v7
      - name: Build the digital garden
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          sed -i "s|^site_url = .*|site_url = \"${PAGES_URL%/}/\"|" zensical.toml
          uv run --locked --python 3.12 zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
