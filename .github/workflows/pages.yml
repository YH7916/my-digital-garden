name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Build the digital garden
        run: |
          sed -i 's|^site_url = .*|site_url = "https://yh7916.github.io/"|' zensical.toml
          uv run --locked --python 3.12 zensical build --clean
      - uses: actions/checkout@v7
        with:
          repository: YH7916/yh7916.github.io
          ref: main
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: pages
      - name: Publish to the account site
        working-directory: pages
        run: |
          rsync -a --delete --exclude='.*' ../site/ ./
          touch .nojekyll
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Publish digital garden from ${GITHUB_SHA}"
          git push origin HEAD:main
