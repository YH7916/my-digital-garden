site_name: Yohaku 的数字花园
site_description: 欢迎光临我的小世界！
site_author: Yohaku

# ----------------- 界面与视觉配置 (Zensical 原生全兼容) -----------------
theme:
  name: material
  language: zh

  favicon: assets/images/favicon.png  # 浏览器标签页上的小图标
  logo: assets/images/favicon.png     # 网页左上角标题旁边的大图标

  font:
    text: Noto Sans
    code: Fira Code
  features:
    # --- 极致导航体验 ---
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.prune           # ✨ 新增：侧边栏极致精简模式

    # --- 沉浸式版面与留白 ---
    - header.autohide            # ✨ 新增：滚动时自动隐藏顶部导航条，纯净阅读

    # --- 搜索与内容交互 ---
    - search.highlight
    - search.suggest
    - search.share
    - content.tooltips           # ✨ 新增：专业名词悬浮提示气泡
    
    # --- 硬核代码与极客操作 ---
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.view        # ✨ 新增：页面右上角“查看 Markdown 源码”按钮

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换至浅色模式

# ----------------- 模块映射预留区 -----------------
# 兼容期：Zensical 底层会自动处理这些传统插件
plugins:
  - search
  - roamlinks
  - awesome-pages
  - tags:                     # ✨ 新增：开启原生标签系统
      tags_file: tags.md      # 指定聚合所有标签的中心页面

# ----------------- 核心 Markdown 解析 -----------------
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji 
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

# ----------------- 外部脚本与样式 -----------------
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
