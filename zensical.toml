# ==========================================
# Zensical 配置文件 — Yohaku 的数字花园
# ==========================================

[project]
site_name = "Yohaku 的数字花园"
site_description = "浙大CS学生的技术笔记与生活碎片"
site_author = "Yohaku"
copyright = "Copyright &copy; 2024~2026 Yohaku"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true

repo_url = "https://github.com/YH7916/my-digital-garden"
repo_name = "YH7916/my-digital-garden"

extra_css = [
    "stylesheets/ziti.css",
    "stylesheets/customize.css",
]

extra_javascript = [
    "assets/javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

# ==========================================
# 主题配置
# ==========================================

[project.theme]
variant = "modern"
language = "zh"
favicon = "assets/images/favicon.png"
logo = "assets/images/favicon.png"
font.code = "Fira Code"

features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.indexes",
    "navigation.path",
    "navigation.top",
    "navigation.footer",
    "navigation.prune",
    "header.autohide",
    "search.highlight",
    "search.suggest",
    "search.share",
    "content.tooltips",
    "content.code.copy",
    "content.code.annotate",
    "content.code.select",
    "content.tabs.link",
    "content.action.view",
    "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "indigo"
toggle.icon = "material/weather-sunny"
toggle.name = "切换至深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "blue"
toggle.icon = "material/weather-night"
toggle.name = "切换至浅色模式"

# ==========================================
# 社交链接
# ==========================================

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/YH7916"
name = "GitHub"

# ==========================================
# 插件配置
# ==========================================

[project.plugins.search]
separator = '[\s​\-]'

[project.plugins.roamlinks]

[project.plugins."awesome-pages"]

[project.plugins.tags]

[project.plugins.glightbox]

# ==========================================
# Markdown 扩展
# ==========================================

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
toc_depth = 3

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"

[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
