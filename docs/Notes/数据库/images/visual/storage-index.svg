<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680">
  <rect width="1160" height="680" fill="#fbfaf7"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
  </defs>
  <text x="580" y="54" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#1f2933">存储与索引：数据很大，所以不能每次全表扫</text>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="80" y="120" width="250" height="400" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="205" y="162" text-anchor="middle" font-size="24" font-weight="700" fill="#075985">存储层级</text>
    <rect x="120" y="205" width="170" height="54" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="205" y="239" text-anchor="middle" font-size="19" fill="#334155">Record 行记录</text>
    <rect x="120" y="285" width="170" height="54" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="205" y="319" text-anchor="middle" font-size="19" fill="#334155">Page 数据页</text>
    <rect x="120" y="365" width="170" height="54" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="205" y="399" text-anchor="middle" font-size="19" fill="#334155">File 表文件</text>
    <rect x="120" y="445" width="170" height="54" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="205" y="479" text-anchor="middle" font-size="19" fill="#334155">Disk / SSD</text>

    <rect x="455" y="120" width="250" height="400" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="580" y="162" text-anchor="middle" font-size="24" font-weight="700" fill="#166534">B+ Tree</text>
    <circle cx="580" cy="230" r="36" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="580" y="237" text-anchor="middle" font-size="18" fill="#334155">root</text>
    <circle cx="520" cy="335" r="32" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <circle cx="640" cy="335" r="32" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="475" y="435" width="210" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="580" y="467" text-anchor="middle" font-size="18" fill="#334155">叶子链表：范围查询友好</text>
    <line x1="568" y1="264" x2="532" y2="306" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="592" y1="264" x2="628" y2="306" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="520" y1="367" x2="520" y2="435" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="640" y1="367" x2="640" y2="435" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="830" y="120" width="250" height="400" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="955" y="162" text-anchor="middle" font-size="24" font-weight="700" fill="#92400e">查询代价</text>
    <text x="955" y="230" text-anchor="middle" font-size="21" fill="#334155">全表扫描</text>
    <text x="955" y="263" text-anchor="middle" font-size="19" fill="#64748b">读很多 page</text>
    <text x="955" y="340" text-anchor="middle" font-size="21" fill="#334155">索引查找</text>
    <text x="955" y="373" text-anchor="middle" font-size="19" fill="#64748b">沿树高读少量 page</text>
    <text x="955" y="450" text-anchor="middle" font-size="21" fill="#334155">范围查询</text>
    <text x="955" y="483" text-anchor="middle" font-size="19" fill="#64748b">定位起点后扫叶子链</text>

    <text x="580" y="604" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">记忆句：数据库性能的大头通常是 I/O；索引的作用是少读 page。</text>
  </g>
</svg>
