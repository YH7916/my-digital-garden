<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#fbfaf7"/>
  <text x="600" y="56" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#1f2933">数据库系统：从现实世界到可靠数据服务</text>
  <text x="600" y="91" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#52606d">第一轮只抓五件事：模型、查询、设计、存储优化、事务可靠性</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#52606d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1f2933" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="50" y="160" width="170" height="130" rx="16" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
    <text x="135" y="208" text-anchor="middle" font-size="24" font-weight="700" fill="#075985">现实世界</text>
    <text x="135" y="242" text-anchor="middle" font-size="17" fill="#334155">学生/课程/订单</text>
    <text x="135" y="270" text-anchor="middle" font-size="17" fill="#334155">业务规则</text>

    <rect x="282" y="160" width="170" height="130" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
    <text x="367" y="208" text-anchor="middle" font-size="24" font-weight="700" fill="#166534">数据模型</text>
    <text x="367" y="242" text-anchor="middle" font-size="17" fill="#334155">关系模型</text>
    <text x="367" y="270" text-anchor="middle" font-size="17" fill="#334155">表/键/约束</text>

    <rect x="514" y="160" width="170" height="130" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <text x="599" y="208" text-anchor="middle" font-size="24" font-weight="700" fill="#92400e">查询语言</text>
    <text x="599" y="242" text-anchor="middle" font-size="17" fill="#334155">SQL</text>
    <text x="599" y="270" text-anchor="middle" font-size="17" fill="#334155">声明“我要什么”</text>

    <rect x="746" y="160" width="170" height="130" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <text x="831" y="208" text-anchor="middle" font-size="24" font-weight="700" fill="#5b21b6">执行引擎</text>
    <text x="831" y="242" text-anchor="middle" font-size="17" fill="#334155">索引/Join/排序</text>
    <text x="831" y="270" text-anchor="middle" font-size="17" fill="#334155">选择低成本计划</text>

    <rect x="978" y="160" width="170" height="130" rx="16" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
    <text x="1063" y="208" text-anchor="middle" font-size="24" font-weight="700" fill="#9f1239">可靠性</text>
    <text x="1063" y="242" text-anchor="middle" font-size="17" fill="#334155">事务/锁/日志</text>
    <text x="1063" y="270" text-anchor="middle" font-size="17" fill="#334155">不乱、不丢</text>

    <line x1="220" y1="225" x2="282" y2="225" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="452" y1="225" x2="514" y2="225" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="684" y1="225" x2="746" y2="225" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="916" y1="225" x2="978" y2="225" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="145" y="398" width="910" height="110" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="435" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">一句话心智模型</text>
    <text x="600" y="473" text-anchor="middle" font-size="22" fill="#334155">DBMS = 把“很多人同时读写的重要数据”变成可查询、可优化、可恢复的系统</text>
  </g>
</svg>
