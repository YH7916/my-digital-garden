<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" viewBox="0 0 1160 640">
  <rect width="1160" height="640" fill="#fbfaf7"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <text x="580" y="54" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#1f2933">从“表”到 SQL：声明式查询的脑内流程</text>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="70" y="130" width="220" height="260" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="180" y="168" text-anchor="middle" font-size="24" font-weight="700" fill="#075985">关系 Relation</text>
    <line x1="105" y1="200" x2="255" y2="200" stroke="#0284c7" stroke-width="2"/>
    <line x1="105" y1="240" x2="255" y2="240" stroke="#94a3b8" stroke-width="1"/>
    <line x1="105" y1="280" x2="255" y2="280" stroke="#94a3b8" stroke-width="1"/>
    <line x1="105" y1="320" x2="255" y2="320" stroke="#94a3b8" stroke-width="1"/>
    <line x1="155" y1="200" x2="155" y2="360" stroke="#94a3b8" stroke-width="1"/>
    <line x1="205" y1="200" x2="205" y2="360" stroke="#94a3b8" stroke-width="1"/>
    <text x="130" y="225" font-size="16" fill="#334155">ID</text>
    <text x="174" y="225" font-size="16" fill="#334155">name</text>
    <text x="218" y="225" font-size="16" fill="#334155">dept</text>
    <text x="105" y="424" font-size="18" fill="#334155">行 = tuple</text>
    <text x="105" y="454" font-size="18" fill="#334155">列 = attribute</text>
    <text x="105" y="484" font-size="18" fill="#334155">键 = 唯一识别行</text>

    <rect x="390" y="130" width="240" height="260" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="510" y="168" text-anchor="middle" font-size="24" font-weight="700" fill="#166534">关系代数</text>
    <text x="510" y="220" text-anchor="middle" font-size="22" fill="#334155">σ 选择 = 过滤行</text>
    <text x="510" y="270" text-anchor="middle" font-size="22" fill="#334155">π 投影 = 选列</text>
    <text x="510" y="320" text-anchor="middle" font-size="22" fill="#334155">⋈ 连接 = 拼表</text>

    <rect x="730" y="130" width="330" height="260" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="895" y="168" text-anchor="middle" font-size="24" font-weight="700" fill="#92400e">SQL</text>
    <text x="765" y="220" font-size="21" fill="#334155">SELECT 列</text>
    <text x="765" y="258" font-size="21" fill="#334155">FROM 表</text>
    <text x="765" y="296" font-size="21" fill="#334155">WHERE 行条件</text>
    <text x="765" y="334" font-size="21" fill="#334155">GROUP BY 分组</text>
    <text x="765" y="372" font-size="21" fill="#334155">HAVING 分组条件</text>

    <line x1="290" y1="260" x2="390" y2="260" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="630" y1="260" x2="730" y2="260" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="580" y="548" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">记忆句：SQL 是关系代数的友好外壳；你说“要什么”，DBMS 决定“怎么拿”。</text>
  </g>
</svg>
